[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tempaudit"
version = "1.0.0"
description = "FinAuditPro - Standalone Offline AI-Assisted Audit Assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "openpyxl>=3.1.0",
    "reportlab>=4.0.0",
    "python-multipart>=0.0.6",
    "PyJWT>=2.8.0",
    "httpx>=0.28.0",
    "pypdf>=4.0.0",
    "xlrd>=2.0.1",
    "pytest>=7.0.0"
]

[tool.setuptools.packages.find]
include = ["backend*"]

