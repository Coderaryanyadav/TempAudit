name: TempAudit quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  focused-regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install locked Python dependencies
        run: python -m pip install -r requirements.lock

      - name: Check frontend JavaScript syntax
        run: |
          node --check frontend/js/api.js
          node --check frontend/js/app.js

      - name: Run frontend API/session regression tests
        run: node frontend/tests/test_login_session_refresh.js

      - name: Run backend migration, auth and backup regressions
        run: >
          pytest -q
          backend/tests/test_migrations_and_database_foundation.py
          backend/tests/test_login_session_refresh.py
          backend/tests/test_security_regressions.py
          backend/tests/test_verified_backup_and_integrity_dashboard.py
